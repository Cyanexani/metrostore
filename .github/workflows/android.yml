name: Android build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build architecture APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleVanillaDebug

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-x86-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-x86-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-universal-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/debug/app-vanilla-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
