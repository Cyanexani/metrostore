name: Android build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (for example 4.7.6)'
        required: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build architecture APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERSION_NAME: ${{ github.event.inputs.version || github.ref_name || '0.0.0' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleVanillaRelease

      - name: Prepare release notes
        id: release_notes
        shell: bash
        run: |
          VERSION_TAG="v${VERSION_NAME#v}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION_TAG" == "v0.0.0" ]]; then
            awk 'BEGIN{p=0} /^Changelog[[:space:]]*:/ {if (p) exit; p=1; print; next} p {print}' CHANGELOG | head -n 20 > release-notes.md
          else
            awk -v ver="${VERSION_TAG#v}" '
              BEGIN {capture=0}
              /^Changelog[[:space:]]*:/ {
                if ($0 ~ ver) { capture=1; print; next }
                if (capture) exit
              }
              capture { print }
            ' CHANGELOG > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf '%s\n' "- Metro Store release ${VERSION_TAG}" > release-notes.md
          fi
          printf '%s\n' "Release notes prepared for ${VERSION_TAG}"

      - name: Create annotated release tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION_TAG="v${VERSION_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$VERSION_TAG" -m "$(cat release-notes.md)"
          git push origin "$VERSION_TAG" --force

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/release/app-vanilla-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/release/app-vanilla-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/release/app-vanilla-x86_64-release*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-x86-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/release/app-vanilla-x86-release*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: metrostore-universal-${{ github.sha }}
          path: app/build/outputs/apk/vanilla/release/app-vanilla-universal-release*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/vanilla/release/app-vanilla-arm64-v8a-release*.apk
            app/build/outputs/apk/vanilla/release/app-vanilla-armeabi-v7a-release*.apk
            app/build/outputs/apk/vanilla/release/app-vanilla-x86_64-release*.apk
            app/build/outputs/apk/vanilla/release/app-vanilla-x86-release*.apk
            app/build/outputs/apk/vanilla/release/app-vanilla-universal-release*.apk
          body_path: release-notes.md
          draft: false
          prerelease: false

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
